<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="280" fill="#f8f8f6"/>
  
  <!-- Title -->
  <text x="200" y="22" fill="#333" font-family="Georgia, serif" font-size="14" text-anchor="middle" font-weight="600">NASDAQ Hybrid Forecasting (2010–2024)</text>
  
  <!-- Axes -->
  <line x1="55" y1="220" x2="370" y2="220" stroke="#333" stroke-width="1.5"/>
  <line x1="55" y1="45" x2="55" y2="220" stroke="#333" stroke-width="1.5"/>
  
  <!-- Grid lines -->
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="55" y1="80" x2="370" y2="80"/>
    <line x1="55" y1="115" x2="370" y2="115"/>
    <line x1="55" y1="150" x2="370" y2="150"/>
    <line x1="55" y1="185" x2="370" y2="185"/>
    <line x1="120" y1="45" x2="120" y2="220"/>
    <line x1="185" y1="45" x2="185" y2="220"/>
    <line x1="250" y1="45" x2="250" y2="220"/>
    <line x1="315" y1="45" x2="315" y2="220"/>
  </g>
  
  <!-- Y-axis labels -->
  <text x="45" y="50" fill="#666" font-family="system-ui" font-size="8" text-anchor="end">16k</text>
  <text x="45" y="85" fill="#666" font-family="system-ui" font-size="8" text-anchor="end">14k</text>
  <text x="45" y="120" fill="#666" font-family="system-ui" font-size="8" text-anchor="end">12k</text>
  <text x="45" y="155" fill="#666" font-family="system-ui" font-size="8" text-anchor="end">10k</text>
  <text x="45" y="190" fill="#666" font-family="system-ui" font-size="8" text-anchor="end">8k</text>
  <text x="45" y="225" fill="#666" font-family="system-ui" font-size="8" text-anchor="end">6k</text>
  
  <!-- X-axis labels -->
  <text x="55" y="235" fill="#666" font-family="system-ui" font-size="8" text-anchor="middle">2010</text>
  <text x="120" y="235" fill="#666" font-family="system-ui" font-size="8" text-anchor="middle">2014</text>
  <text x="185" y="235" fill="#666" font-family="system-ui" font-size="8" text-anchor="middle">2018</text>
  <text x="250" y="235" fill="#666" font-family="system-ui" font-size="8" text-anchor="middle">2022</text>
  <text x="315" y="235" fill="#666" font-family="system-ui" font-size="8" text-anchor="middle">2024</text>
  
  <!-- Historical area fill -->
  <path d="M 55 200 L 75 195 L 95 190 L 115 180 L 135 175 L 155 165 L 175 155 L 195 130 L 215 140 L 235 110 L 255 95 L 275 85 L 275 220 L 55 220 Z" 
        fill="#4a9079" opacity="0.15"/>
  
  <!-- Prediction area fill -->
  <path d="M 275 85 L 295 75 L 315 65 L 335 58 L 355 52 L 355 220 L 275 220 Z" 
        fill="#c45a3b" opacity="0.15"/>
  
  <!-- Historical line -->
  <path d="M 55 200 L 75 195 L 95 190 L 115 180 L 135 175 L 155 165 L 175 155 L 195 130 L 215 140 L 235 110 L 255 95 L 275 85" 
        fill="none" stroke="#4a9079" stroke-width="2.5"/>
  
  <!-- Prediction line -->
  <path d="M 275 85 L 295 75 L 315 65 L 335 58 L 355 52" 
        fill="none" stroke="#c45a3b" stroke-width="2.5" stroke-dasharray="6,3"/>
  
  <!-- Confidence interval -->
  <path d="M 275 85 Q 305 60 335 45 L 355 38 L 355 66 Q 325 75 295 82 L 275 85" 
        fill="#c45a3b" opacity="0.1"/>
  <path d="M 275 85 Q 305 95 335 78 L 355 66 L 355 52 Q 325 65 295 75 L 275 85" 
        fill="#c45a3b" opacity="0.1"/>
  
  <!-- Key data points -->
  <circle cx="115" cy="180" r="3" fill="#4a9079"/>
  <circle cx="195" cy="130" r="3" fill="#4a9079"/>
  <circle cx="255" cy="95" r="3" fill="#4a9079"/>
  <circle cx="275" cy="85" r="5" fill="#c45a3b" stroke="#f8f8f6" stroke-width="2"/>
  
  <!-- Vertical divider at prediction start -->
  <line x1="275" y1="45" x2="275" y2="220" stroke="#c45a3b" stroke-width="1" stroke-dasharray="4,3"/>
  
  <!-- Model info box -->
  <g transform="translate(290, 100)">
    <rect width="70" height="45" rx="3" fill="#f0efe8" stroke="#999"/>
    <text x="35" y="15" fill="#333" font-family="system-ui" font-size="8" text-anchor="middle" font-weight="600">Hybrid Model</text>
    <text x="35" y="28" fill="#666" font-family="system-ui" font-size="7" text-anchor="middle">ARIMAX</text>
    <text x="35" y="40" fill="#666" font-family="system-ui" font-size="7" text-anchor="middle">+ LSTM residual</text>
  </g>
  
  <!-- Axis titles -->
  <text x="200" y="255" fill="#333" font-family="system-ui" font-size="10" text-anchor="middle">Year</text>
  <text x="20" y="130" fill="#333" font-family="system-ui" font-size="10" text-anchor="middle" transform="rotate(-90 20 130)">NASDAQ Index</text>
  
  <!-- Legend -->
  <g transform="translate(60, 255)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#4a9079" stroke-width="2.5"/>
    <text x="30" y="4" fill="#666" font-family="system-ui" font-size="8">Historical</text>
    <line x1="100" y1="0" x2="125" y2="0" stroke="#c45a3b" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="130" y="4" fill="#666" font-family="system-ui" font-size="8">ARIMAX+LSTM Forecast</text>
  </g>
</svg>