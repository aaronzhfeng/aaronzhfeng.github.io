<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="280" fill="#f8f8f6"/>
  
  <!-- Title -->
  <text x="200" y="25" fill="#333" font-family="Georgia, serif" font-size="14" text-anchor="middle" font-weight="600">3D Molecular Graph Neural Network</text>
  
  <!-- Molecular bonds (back layer - dashed for depth) -->
  <line x1="180" y1="190" x2="230" y2="210" stroke="#bbb" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="180" y1="190" x2="130" y2="210" stroke="#bbb" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Molecular bonds (main) -->
  <line x1="200" y1="100" x2="145" y2="145" stroke="#666" stroke-width="3"/>
  <line x1="200" y1="100" x2="255" y2="145" stroke="#666" stroke-width="3"/>
  <line x1="145" y1="145" x2="180" y2="190" stroke="#666" stroke-width="3"/>
  <line x1="255" y1="145" x2="180" y2="190" stroke="#666" stroke-width="3"/>
  
  <!-- Double bond indicator -->
  <line x1="207" y1="97" x2="260" y2="140" stroke="#666" stroke-width="2"/>
  
  <!-- Hydrogen bonds -->
  <line x1="200" y1="100" x2="200" y2="55" stroke="#999" stroke-width="2"/>
  <line x1="145" y1="145" x2="95" y2="125" stroke="#999" stroke-width="2"/>
  <line x1="255" y1="145" x2="305" y2="125" stroke="#999" stroke-width="2"/>
  
  <!-- Atoms -->
  <!-- Central Carbon -->
  <circle cx="200" cy="100" r="18" fill="#555" stroke="#333" stroke-width="2"/>
  <text x="200" y="105" fill="white" font-family="system-ui" font-size="13" text-anchor="middle" font-weight="bold">C</text>
  
  <!-- Left Carbon -->
  <circle cx="145" cy="145" r="18" fill="#555" stroke="#333" stroke-width="2"/>
  <text x="145" y="150" fill="white" font-family="system-ui" font-size="13" text-anchor="middle" font-weight="bold">C</text>
  
  <!-- Right Oxygen -->
  <circle cx="255" cy="145" r="16" fill="#c45a3b" stroke="#a04030" stroke-width="2"/>
  <text x="255" y="150" fill="white" font-family="system-ui" font-size="13" text-anchor="middle" font-weight="bold">O</text>
  
  <!-- Bottom Nitrogen -->
  <circle cx="180" cy="190" r="17" fill="#4a6fa5" stroke="#3a5f95" stroke-width="2"/>
  <text x="180" y="195" fill="white" font-family="system-ui" font-size="13" text-anchor="middle" font-weight="bold">N</text>
  
  <!-- Hydrogens -->
  <circle cx="200" cy="55" r="11" fill="#e8e8e8" stroke="#aaa" stroke-width="1.5"/>
  <text x="200" y="59" fill="#555" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="bold">H</text>
  
  <circle cx="95" cy="125" r="11" fill="#e8e8e8" stroke="#aaa" stroke-width="1.5"/>
  <text x="95" y="129" fill="#555" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="bold">H</text>
  
  <circle cx="305" cy="125" r="11" fill="#e8e8e8" stroke="#aaa" stroke-width="1.5"/>
  <text x="305" y="129" fill="#555" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="bold">H</text>
  
  <!-- Back atoms (depth) -->
  <circle cx="130" cy="210" r="10" fill="#888" opacity="0.4"/>
  <circle cx="230" cy="210" r="10" fill="#888" opacity="0.4"/>
  
  <!-- 3D coordinate axes -->
  <g transform="translate(340, 220)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#c45a3b" stroke-width="2"/>
    <text x="35" y="4" fill="#c45a3b" font-family="system-ui" font-size="10" font-weight="600">x</text>
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#4a9079" stroke-width="2"/>
    <text x="-4" y="-35" fill="#4a9079" font-family="system-ui" font-size="10" font-weight="600">y</text>
    <line x1="0" y1="0" x2="-18" y2="12" stroke="#4a6fa5" stroke-width="2"/>
    <text x="-28" y="18" fill="#4a6fa5" font-family="system-ui" font-size="10" font-weight="600">z</text>
  </g>
  
  <!-- Message passing arrows -->
  <g opacity="0.6">
    <path d="M 178 112 Q 162 125 155 135" stroke="#7c6ca6" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M 222 112 Q 238 125 245 135" stroke="#7c6ca6" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Legend -->
  <g transform="translate(30, 245)">
    <circle cx="8" cy="0" r="6" fill="#555"/>
    <text x="20" y="4" fill="#666" font-family="system-ui" font-size="9">Carbon</text>
    <circle cx="78" cy="0" r="6" fill="#c45a3b"/>
    <text x="90" y="4" fill="#666" font-family="system-ui" font-size="9">Oxygen</text>
    <circle cx="158" cy="0" r="6" fill="#4a6fa5"/>
    <text x="170" y="4" fill="#666" font-family="system-ui" font-size="9">Nitrogen</text>
    <circle cx="248" cy="0" r="5" fill="#e8e8e8" stroke="#aaa"/>
    <text x="258" y="4" fill="#666" font-family="system-ui" font-size="9">Hydrogen</text>
  </g>
</svg>