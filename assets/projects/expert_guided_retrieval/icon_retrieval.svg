<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="280" fill="#f8f8f6"/>
  
  <!-- Title -->
  <text x="200" y="22" fill="#333" font-family="Georgia, serif" font-size="14" text-anchor="middle" font-weight="600">MoE-Enhanced Dense Retrieval</text>
  
  <!-- Query input -->
  <g transform="translate(20, 95)">
    <rect width="60" height="70" rx="3" fill="#f0efe8" stroke="#999"/>
    <text x="30" y="22" fill="#333" font-family="system-ui" font-size="9" text-anchor="middle" font-weight="600">Query</text>
    <text x="30" y="40" fill="#666" font-family="system-ui" font-size="7" text-anchor="middle">embedding</text>
    <rect x="10" y="48" width="40" height="12" rx="2" fill="#4a6fa5" opacity="0.6"/>
  </g>
  
  <!-- TinyBERT + MoE block -->
  <g transform="translate(100, 55)">
    <rect width="100" height="150" rx="5" fill="#e8f0f4" stroke="#4a6fa5" stroke-width="2"/>
    <text x="50" y="20" fill="#4a6fa5" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="700">TinyBERT</text>
    
    <!-- Encoder layers -->
    <rect x="10" y="32" width="80" height="25" rx="3" fill="#4a6fa5"/>
    <text x="50" y="48" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">Encoder</text>
    
    <!-- MoE block -->
    <rect x="10" y="65" width="80" height="40" rx="3" fill="#7c6ca6"/>
    <text x="50" y="82" fill="white" font-family="system-ui" font-size="8" text-anchor="middle" font-weight="600">MoE Block</text>
    <text x="50" y="96" fill="rgba(255,255,255,0.8)" font-family="system-ui" font-size="7" text-anchor="middle">4 Experts</text>
    
    <!-- Pooling -->
    <rect x="10" y="113" width="80" height="25" rx="3" fill="#4a6fa5"/>
    <text x="50" y="130" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">Pooling</text>
  </g>
  
  <!-- Arrow from query to encoder -->
  <line x1="80" y1="130" x2="98" y2="130" stroke="#666" stroke-width="1.5"/>
  <polygon points="98,130 92,126 92,134" fill="#666"/>
  
  <!-- Document corpus -->
  <g transform="translate(230, 45)">
    <text x="50" y="0" fill="#333" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="600">SciFact Corpus</text>
    
    <!-- Stacked documents -->
    <rect x="15" y="18" width="70" height="50" rx="2" fill="#e8e8e8" stroke="#bbb"/>
    <rect x="10" y="13" width="70" height="50" rx="2" fill="#f0f0f0" stroke="#bbb"/>
    <rect x="5" y="8" width="70" height="50" rx="2" fill="#f8f8f8" stroke="#aaa"/>
    
    <!-- Document lines -->
    <line x1="12" y1="20" x2="65" y2="20" stroke="#aaa" stroke-width="2"/>
    <line x1="12" y1="30" x2="60" y2="30" stroke="#bbb" stroke-width="1.5"/>
    <line x1="12" y1="38" x2="55" y2="38" stroke="#bbb" stroke-width="1.5"/>
    <line x1="12" y1="46" x2="50" y2="46" stroke="#ccc" stroke-width="1"/>
  </g>
  
  <!-- Similarity computation -->
  <g transform="translate(215, 130)">
    <circle cx="20" cy="20" r="15" fill="#f0efe8" stroke="#999"/>
    <text x="20" y="24" fill="#333" font-family="system-ui" font-size="12" text-anchor="middle">·</text>
  </g>
  
  <!-- Lines from encoder to similarity -->
  <line x1="200" y1="130" x2="215" y2="145" stroke="#666" stroke-width="1.5"/>
  
  <!-- Lines from corpus to similarity -->
  <line x1="265" y1="80" x2="245" y2="135" stroke="#666" stroke-width="1.5"/>
  
  <!-- Retrieval results -->
  <g transform="translate(280, 110)">
    <rect width="95" height="120" rx="4" fill="#f0efe8" stroke="#4a9079" stroke-width="2"/>
    <text x="47" y="18" fill="#4a9079" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="600">Top-K Results</text>
    
    <!-- Result bars -->
    <rect x="10" y="30" width="70" height="18" rx="2" fill="#4a9079"/>
    <text x="50" y="43" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">0.94</text>
    
    <rect x="10" y="54" width="58" height="18" rx="2" fill="#6ab39a"/>
    <text x="44" y="67" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">0.87</text>
    
    <rect x="10" y="78" width="45" height="18" rx="2" fill="#8cc9b5"/>
    <text x="37" y="91" fill="#333" font-family="system-ui" font-size="8" text-anchor="middle">0.76</text>
    
    <text x="47" y="110" fill="#666" font-family="system-ui" font-size="7" text-anchor="middle">NDCG@10 ↑</text>
  </g>
  
  <!-- Arrow to results -->
  <line x1="250" y1="150" x2="278" y2="165" stroke="#666" stroke-width="1.5"/>
  <polygon points="278,165 270,165 274,158" fill="#666"/>
  
  <!-- Metrics -->
  <g transform="translate(30, 250)">
    <text x="0" y="0" fill="#666" font-family="system-ui" font-size="9">Metrics: NDCG@10, Recall@100 on BEIR SciFact</text>
  </g>
</svg>