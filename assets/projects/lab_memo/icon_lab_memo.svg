<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9079" />
      <stop offset="100%" style="stop-color:#3d7a66" />
    </linearGradient>
    <linearGradient id="selectorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6ca6" />
      <stop offset="100%" style="stop-color:#6b5c94" />
    </linearGradient>
    <linearGradient id="verifierGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5a8a5e" />
      <stop offset="100%" style="stop-color:#4a7a4e" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="280" fill="#f8f8f6"/>
  
  <!-- Title -->
  <text x="200" y="28" fill="#333" font-family="Georgia, serif" font-size="16" text-anchor="middle" font-weight="600">Planner–Selector–Verifier Architecture</text>
  
  <!-- Main architecture boxes -->
  <g transform="translate(50, 50)">
    <!-- Planner -->
    <rect width="80" height="50" rx="4" fill="url(#plannerGrad)"/>
    <text x="40" y="30" fill="white" font-family="system-ui" font-size="11" text-anchor="middle" font-weight="600">Planner</text>
    
    <!-- Arrow 1 -->
    <line x1="85" y1="25" x2="115" y2="25" stroke="#666" stroke-width="1.5"/>
    <polygon points="115,25 108,21 108,29" fill="#666"/>
    
    <!-- Selector -->
    <g transform="translate(120, 0)">
      <rect width="80" height="50" rx="4" fill="url(#selectorGrad)"/>
      <text x="40" y="30" fill="white" font-family="system-ui" font-size="11" text-anchor="middle" font-weight="600">Selector</text>
    </g>
    
    <!-- Arrow 2 -->
    <line x1="205" y1="25" x2="235" y2="25" stroke="#666" stroke-width="1.5"/>
    <polygon points="235,25 228,21 228,29" fill="#666"/>
    
    <!-- Verifier -->
    <g transform="translate(240, 0)">
      <rect width="80" height="50" rx="4" fill="url(#verifierGrad)"/>
      <text x="40" y="30" fill="white" font-family="system-ui" font-size="11" text-anchor="middle" font-weight="600">Verifier</text>
    </g>
  </g>
  
  <!-- Memory Bank -->
  <g transform="translate(120, 140)">
    <rect width="160" height="70" rx="4" fill="#f0efe8" stroke="#999" stroke-width="1"/>
    <text x="80" y="22" fill="#333" font-family="system-ui" font-size="12" text-anchor="middle" font-weight="600">Memory Bank</text>
    
    <!-- Memory slots -->
    <g transform="translate(15, 35)">
      <rect width="25" height="25" rx="2" fill="#d4d3c9" stroke="#aaa"/>
      <rect x="32" y="0" width="25" height="25" rx="2" fill="#c4c3b9" stroke="#aaa"/>
      <rect x="64" y="0" width="25" height="25" rx="2" fill="#b4b3a9" stroke="#aaa"/>
      <rect x="96" y="0" width="25" height="25" rx="2" fill="#a4a399" stroke="#aaa"/>
    </g>
  </g>
  
  <!-- Connecting lines to memory -->
  <path d="M 90 100 L 90 120 L 150 135" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="4,2"/>
  <path d="M 200 100 L 200 135" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="4,2"/>
  <path d="M 310 100 L 310 120 L 250 135" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="4,2"/>
  
  <!-- Wave equation visualization -->
  <g transform="translate(30, 225)">
    <text x="0" y="0" fill="#666" font-family="system-ui" font-size="10">Neural Operator Task:</text>
    <path d="M 120 -5 Q 145 -25 170 -5 T 220 -5 T 270 -5 T 320 -5" fill="none" stroke="#7c6ca6" stroke-width="2"/>
    <path d="M 120 5 Q 150 -20 180 5 T 240 5 T 300 5" fill="none" stroke="#4a9079" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Labels -->
  <text x="90" y="118" fill="#666" font-family="system-ui" font-size="8" text-anchor="middle">read</text>
  <text x="200" y="128" fill="#666" font-family="system-ui" font-size="8" text-anchor="middle">select</text>
  <text x="310" y="118" fill="#666" font-family="system-ui" font-size="8" text-anchor="middle">verify</text>
</svg>