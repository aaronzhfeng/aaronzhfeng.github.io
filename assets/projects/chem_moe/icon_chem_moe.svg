<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="280" fill="#f8f8f6"/>
  
  <!-- Title -->
  <text x="200" y="25" fill="#333" font-family="Georgia, serif" font-size="14" text-anchor="middle" font-weight="600">Mixture-of-Experts for Reaction Prediction</text>
  
  <!-- Input -->
  <g transform="translate(25, 100)">
    <rect width="55" height="60" rx="3" fill="#f0efe8" stroke="#999"/>
    <text x="27" y="25" fill="#333" font-family="system-ui" font-size="9" text-anchor="middle" font-weight="600">Input</text>
    <text x="27" y="40" fill="#666" font-family="monospace" font-size="8" text-anchor="middle">SMILES</text>
    <text x="27" y="52" fill="#888" font-family="monospace" font-size="7" text-anchor="middle">CC(=O)O</text>
  </g>
  
  <!-- Router/Gate -->
  <g transform="translate(100, 110)">
    <rect width="50" height="40" rx="20" fill="#d4d3c9" stroke="#999"/>
    <text x="25" y="25" fill="#333" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="600">Gate</text>
  </g>
  
  <!-- Arrow from input to gate -->
  <line x1="80" y1="130" x2="98" y2="130" stroke="#666" stroke-width="1.5"/>
  <polygon points="98,130 92,126 92,134" fill="#666"/>
  
  <!-- Experts -->
  <g transform="translate(175, 45)">
    <rect width="75" height="35" rx="3" fill="#c45a3b" opacity="0.85"/>
    <text x="37" y="15" fill="white" font-family="system-ui" font-size="9" text-anchor="middle" font-weight="600">Expert 1</text>
    <text x="37" y="27" fill="rgba(255,255,255,0.8)" font-family="system-ui" font-size="7" text-anchor="middle">Oxidation</text>
  </g>
  
  <g transform="translate(175, 95)">
    <rect width="75" height="35" rx="3" fill="#7c6ca6" opacity="0.85"/>
    <text x="37" y="15" fill="white" font-family="system-ui" font-size="9" text-anchor="middle" font-weight="600">Expert 2</text>
    <text x="37" y="27" fill="rgba(255,255,255,0.8)" font-family="system-ui" font-size="7" text-anchor="middle">Reduction</text>
  </g>
  
  <g transform="translate(175, 145)">
    <rect width="75" height="35" rx="3" fill="#4a9079" opacity="0.85"/>
    <text x="37" y="15" fill="white" font-family="system-ui" font-size="9" text-anchor="middle" font-weight="600">Expert 3</text>
    <text x="37" y="27" fill="rgba(255,255,255,0.8)" font-family="system-ui" font-size="7" text-anchor="middle">C-C Bond</text>
  </g>
  
  <g transform="translate(175, 195)">
    <rect width="75" height="35" rx="3" fill="#5a7a9a" opacity="0.85"/>
    <text x="37" y="15" fill="white" font-family="system-ui" font-size="9" text-anchor="middle" font-weight="600">Expert 4</text>
    <text x="37" y="27" fill="rgba(255,255,255,0.8)" font-family="system-ui" font-size="7" text-anchor="middle">Substitution</text>
  </g>
  
  <!-- Routing lines with weights -->
  <path d="M 150 130 Q 162 85 175 62" stroke="#c45a3b" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 150 130 Q 162 118 175 112" stroke="#7c6ca6" stroke-width="2.5" fill="none"/>
  <path d="M 150 130 Q 162 145 175 162" stroke="#4a9079" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M 150 130 Q 162 175 175 212" stroke="#5a7a9a" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Weight labels -->
  <text x="158" y="78" fill="#c45a3b" font-family="system-ui" font-size="7" opacity="0.7">0.1</text>
  <text x="160" y="118" fill="#7c6ca6" font-family="system-ui" font-size="8" font-weight="600">0.5</text>
  <text x="160" y="155" fill="#4a9079" font-family="system-ui" font-size="7">0.3</text>
  <text x="158" y="195" fill="#5a7a9a" font-family="system-ui" font-size="7" opacity="0.7">0.1</text>
  
  <!-- Aggregation -->
  <g transform="translate(270, 110)">
    <circle cx="20" cy="20" r="18" fill="#f0efe8" stroke="#999"/>
    <text x="20" y="25" fill="#333" font-family="system-ui" font-size="16" text-anchor="middle">Σ</text>
  </g>
  
  <!-- Lines to aggregation -->
  <line x1="250" y1="62" x2="270" y2="115" stroke="#666" stroke-width="1" opacity="0.5"/>
  <line x1="250" y1="112" x2="270" y2="125" stroke="#666" stroke-width="1.5"/>
  <line x1="250" y1="162" x2="270" y2="135" stroke="#666" stroke-width="1.2"/>
  <line x1="250" y1="212" x2="270" y2="145" stroke="#666" stroke-width="1" opacity="0.5"/>
  
  <!-- Output -->
  <g transform="translate(320, 100)">
    <rect width="55" height="60" rx="3" fill="#f0efe8" stroke="#4a9079" stroke-width="2"/>
    <text x="27" y="25" fill="#333" font-family="system-ui" font-size="9" text-anchor="middle" font-weight="600">Output</text>
    <text x="27" y="40" fill="#4a9079" font-family="monospace" font-size="8" text-anchor="middle">Product</text>
    <text x="27" y="52" fill="#888" font-family="monospace" font-size="7" text-anchor="middle">CCO</text>
  </g>
  
  <!-- Arrow to output -->
  <line x1="308" y1="130" x2="318" y2="130" stroke="#666" stroke-width="1.5"/>
  <polygon points="318,130 312,126 312,134" fill="#666"/>
</svg>