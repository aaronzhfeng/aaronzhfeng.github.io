<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="280" fill="#f8f8f6"/>
  
  <!-- Title -->
  <text x="200" y="22" fill="#333" font-family="Georgia, serif" font-size="14" text-anchor="middle" font-weight="600">Transformer for Chemical Reaction Prediction</text>
  
  <!-- Input SMILES box -->
  <g transform="translate(20, 85)">
    <rect width="50" height="100" rx="3" fill="#f0efe8" stroke="#999"/>
    <text x="25" y="18" fill="#333" font-family="system-ui" font-size="8" text-anchor="middle" font-weight="600">Input</text>
    <text x="25" y="38" fill="#666" font-family="monospace" font-size="10" text-anchor="middle">C</text>
    <text x="25" y="52" fill="#666" font-family="monospace" font-size="10" text-anchor="middle">C</text>
    <text x="25" y="66" fill="#666" font-family="monospace" font-size="10" text-anchor="middle">(</text>
    <text x="25" y="80" fill="#666" font-family="monospace" font-size="10" text-anchor="middle">=O</text>
    <text x="25" y="94" fill="#666" font-family="monospace" font-size="10" text-anchor="middle">)</text>
  </g>
  
  <!-- Encoder block -->
  <g transform="translate(90, 45)">
    <rect width="95" height="190" rx="5" fill="#e8f4f0" stroke="#4a9079" stroke-width="2"/>
    <text x="47" y="20" fill="#4a9079" font-family="system-ui" font-size="11" text-anchor="middle" font-weight="700">Encoder</text>
    
    <!-- Multi-head attention -->
    <rect x="10" y="35" width="75" height="35" rx="3" fill="#4a9079"/>
    <text x="47" y="50" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">Multi-Head</text>
    <text x="47" y="62" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">Attention</text>
    
    <!-- Add &amp; Norm -->
    <rect x="10" y="78" width="75" height="22" rx="3" fill="#f0efe8" stroke="#aaa"/>
    <text x="47" y="93" fill="#666" font-family="system-ui" font-size="8" text-anchor="middle">Add &amp; Norm</text>
    
    <!-- FFN -->
    <rect x="10" y="108" width="75" height="35" rx="3" fill="#4a9079"/>
    <text x="47" y="123" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">Feed</text>
    <text x="47" y="135" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">Forward</text>
    
    <!-- Add &amp; Norm 2 -->
    <rect x="10" y="151" width="75" height="22" rx="3" fill="#f0efe8" stroke="#aaa"/>
    <text x="47" y="166" fill="#666" font-family="system-ui" font-size="8" text-anchor="middle">Add &amp; Norm</text>
    
    <!-- Nx -->
    <text x="47" y="185" fill="#4a9079" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="600">×N</text>
  </g>
  
  <!-- Decoder block -->
  <g transform="translate(205, 35)">
    <rect width="95" height="210" rx="5" fill="#fdf4e8" stroke="#c45a3b" stroke-width="2"/>
    <text x="47" y="20" fill="#c45a3b" font-family="system-ui" font-size="11" text-anchor="middle" font-weight="700">Decoder</text>
    
    <!-- Masked attention -->
    <rect x="10" y="35" width="75" height="32" rx="3" fill="#c45a3b"/>
    <text x="47" y="48" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">Masked</text>
    <text x="47" y="60" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">Attention</text>
    
    <!-- Add &amp; Norm -->
    <rect x="10" y="73" width="75" height="20" rx="3" fill="#f0efe8" stroke="#aaa"/>
    <text x="47" y="87" fill="#666" font-family="system-ui" font-size="8" text-anchor="middle">Add &amp; Norm</text>
    
    <!-- Cross attention -->
    <rect x="10" y="100" width="75" height="32" rx="3" fill="#7c6ca6"/>
    <text x="47" y="113" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">Cross</text>
    <text x="47" y="125" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">Attention</text>
    
    <!-- Add &amp; Norm 2 -->
    <rect x="10" y="138" width="75" height="20" rx="3" fill="#f0efe8" stroke="#aaa"/>
    <text x="47" y="152" fill="#666" font-family="system-ui" font-size="8" text-anchor="middle">Add &amp; Norm</text>
    
    <!-- FFN -->
    <rect x="10" y="164" width="75" height="32" rx="3" fill="#c45a3b"/>
    <text x="47" y="177" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">Feed</text>
    <text x="47" y="189" fill="white" font-family="system-ui" font-size="8" text-anchor="middle">Forward</text>
    
    <!-- Nx -->
    <text x="47" y="208" fill="#c45a3b" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="600">×N</text>
  </g>
  
  <!-- Cross attention connection -->
  <path d="M 185 140 L 195 140 L 195 151 L 205 151" stroke="#7c6ca6" stroke-width="2" fill="none"/>
  <polygon points="205,151 199,147 199,155" fill="#7c6ca6"/>
  
  <!-- Output SMILES box -->
  <g transform="translate(320, 85)">
    <rect width="55" height="100" rx="3" fill="#f0efe8" stroke="#4a9079" stroke-width="2"/>
    <text x="27" y="18" fill="#4a9079" font-family="system-ui" font-size="8" text-anchor="middle" font-weight="600">Output</text>
    <text x="27" y="40" fill="#4a9079" font-family="monospace" font-size="10" text-anchor="middle">C</text>
    <text x="27" y="54" fill="#4a9079" font-family="monospace" font-size="10" text-anchor="middle">C</text>
    <text x="27" y="68" fill="#4a9079" font-family="monospace" font-size="10" text-anchor="middle">O</text>
    <text x="27" y="82" fill="#888" font-family="monospace" font-size="10" text-anchor="middle">...</text>
  </g>
  
  <!-- Arrow: input to encoder -->
  <line x1="70" y1="135" x2="88" y2="135" stroke="#666" stroke-width="1.5"/>
  <polygon points="88,135 82,131 82,139" fill="#666"/>
  
  <!-- Arrow: decoder to output -->
  <line x1="300" y1="140" x2="318" y2="140" stroke="#666" stroke-width="1.5"/>
  <polygon points="318,140 312,136 312,144" fill="#666"/>
  
  <!-- Labels -->
  <text x="45" y="250" fill="#666" font-family="system-ui" font-size="9" text-anchor="middle">Reactants</text>
  <text x="347" y="250" fill="#4a9079" font-family="system-ui" font-size="9" text-anchor="middle">Products</text>
</svg>